name: V1 native UI evidence

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Focused native parameters and Windows coordinator proof
        run: python3 scripts/v1-parameter-evidence.py verify docs/evidence/issue-14/parameters
